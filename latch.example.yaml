# Latch configuration. Every key can be overridden by a LATCH_ environment
# variable: LATCH_ + the key path upper-cased with _ between levels, e.g.
# LATCH_SMTP_HOST, LATCH_BRANDING_PRIMARY_COLOR. LATCH_TRUSTED_PROXIES is
# comma-separated. Durations accept Go syntax (30m, 336h) plus a "d" suffix
# for days (30d); each must be more than 0.

public_url: https://login.example.org      # issuer; no trailing slash
listen: 0.0.0.0:8080
data_dir: /var/lib/latch                   # latch.db, uploaded icons
# trusted_proxies must list your reverse proxy's address (CIDR ranges or
# IPs); only its X-Forwarded-For/Proto headers are believed. Use
# 127.0.0.1/32 when it runs on the same host, 172.16.0.0/12 for Docker's
# default networks. Leave it empty only if nothing sits in front of Latch.
# With the proxy missing, every member seems to come from its address, so a
# few failed sign-ins lock everyone out; Latch logs a warning when it
# ignores forwarded headers.
trusted_proxies: []
# encryption_key: <32 bytes base64>        # at-rest encryption of TOTP secrets, signing keys; generated by `latch init`
branding:
  name: Latch
  logo: /var/lib/latch/logo.png            # or URL; served at /static/logo
  primary_color: "#2c6e49"
  support_text: "Need help? Email membership@hackspace.example"
smtp:
  host: smtp.example.org
  port: 587
  username: ""
  password: ""
  from: "Hackspace Login <login@hackspace.example>"
  tls: starttls                             # starttls | tls | none
sessions:
  idle: 336h
  absolute: 720h
tokens:
  access: 1h                                # at most 24h
  id: 1h                                    # at most 24h
  refresh: 720h
  refresh_absolute: 2160h                   # at least tokens.refresh
  require_offline_access_for_refresh: false
password:
  min_length: 10                            # at least 10
log:
  level: info
  format: json                              # json | text
