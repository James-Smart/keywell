# Keywell under Docker Compose. See "Running Keywell for real" in the README for
# the one-off `init` step to run before `up -d`.
services:
  keywell:
    build:
      context: ..
      args:
        # Shown by `keywell version` and /healthz. Set VERSION in the environment.
        VERSION: "${VERSION:-dev}"
    image: keywell:local
    restart: unless-stopped
    # Published on the host's loopback only. Put a reverse proxy that
    # terminates TLS in front of it.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Holds keywell.yaml, keywell.db and icons/.
      - keywell-data:/var/lib/keywell
    environment:
      # The image has no shell for editing the config file, so set anything
      # else here with KEYWELL_ variables, which override the file. For example:
      #   KEYWELL_SMTP_HOST: smtp.example.org
      #   KEYWELL_SMTP_PORT: "587"
      #   KEYWELL_SMTP_USERNAME: keywell
      #   KEYWELL_SMTP_PASSWORD: change-me
      #   KEYWELL_SMTP_FROM: login@example.org
      #   KEYWELL_SMTP_TLS: starttls
      #   KEYWELL_PUBLIC_URL: https://login.example.org
      # Publish the metrics port only to a private network:
      #   KEYWELL_METRICS_LISTEN: 0.0.0.0:9100
      # keywell.example.yaml lists every setting; the variable is KEYWELL_ plus the key path.
      # Docker's default networks, where a proxy on the host or in a container appears.
      KEYWELL_TRUSTED_PROXIES: "172.16.0.0/12"

volumes:
  keywell-data:
    # A fixed name, so backups can mount it whatever the compose project is called.
    name: keywell-data
