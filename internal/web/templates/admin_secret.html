{{define "content"}}
{{- with .Data}}
<h1>{{.Heading}}</h1>
<section class="panel">
  <p>{{.Intro}}</p>
  <dl class="facts">
  {{- range .Items}}
    <dt>{{.Label}}</dt>
    <dd><code class="secret">{{.Value}}</code></dd>
  {{- end}}
  </dl>
  {{- with .Example}}
  <pre>{{.}}</pre>
  {{- end}}
  <p><a class="button" href="{{.Back}}">I've copied it</a></p>
</section>
{{- end}}
{{end}}
