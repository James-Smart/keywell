{{define "content"}}
<h1>Change password</h1>
<form method="post" action="/account/password" class="form">
  <label for="current">Current password</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required autofocus>
  <label for="password">New password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <label for="confirm">Type the new password again</label>
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
  <button type="submit">Change password</button>
</form>
<p>At least {{.Data.MinLength}} characters. Changing your password signs you out on your other devices.</p>
<p><a href="/account">Back to your account</a></p>
{{end}}
